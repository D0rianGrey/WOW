<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="arthas-title arthas-desc">
  <title id="arthas-title">Путь Arthas</title>
  <desc id="arthas-desc">Схема: Stratholme в Lordaeron, затем Northrend и Frostmourne, возвращение в Lordaeron и убийство короля Terenas, Quel’Thalas и Sunwell, Dalaran и призыв Archimonde, и наконец Frozen Throne в Northrend.</desc>
  <rect width="960" height="420" fill="#10151a"/>
  <g fill="none" stroke="#d7b779" stroke-width="3" stroke-dasharray="10 8">
    <path d="M150 300 C 220 120, 330 80, 420 90"/>
    <path d="M470 110 C 430 200, 320 260, 210 300"/>
    <path d="M230 320 C 380 360, 520 360, 640 300"/>
    <path d="M660 290 C 560 250, 420 250, 330 250"/>
    <path d="M330 230 C 480 120, 640 70, 780 90"/>
  </g>
  <g font-family="Georgia, serif" fill="#e8e4da" text-anchor="middle">
    <circle cx="180" cy="310" r="34" fill="#20342b" stroke="#bed6c8" stroke-width="2"/>
    <text x="180" y="316" font-size="15">1</text>
    <text x="180" y="370" font-size="17">Lordaeron</text>
    <text x="180" y="392" font-size="13" fill="#a3a9ac">Stratholme; убийство Terenas</text>
    <circle cx="450" cy="90" r="34" fill="#1b2c3a" stroke="#9bc0d8" stroke-width="2"/>
    <text x="450" y="96" font-size="15">2</text>
    <text x="450" y="40" font-size="17">Northrend</text>
    <text x="450" y="148" font-size="13" fill="#a3a9ac">Frostmourne</text>
    <circle cx="670" cy="300" r="34" fill="#34253d" stroke="#e1ccf6" stroke-width="2"/>
    <text x="670" y="306" font-size="15">3</text>
    <text x="670" y="360" font-size="17">Quel’Thalas</text>
    <text x="670" y="382" font-size="13" fill="#a3a9ac">Sunwell; Kel’Thuzad — lich</text>
    <circle cx="300" cy="240" r="30" fill="#3d2d1c" stroke="#edd0a2" stroke-width="2"/>
    <text x="300" y="246" font-size="15">4</text>
    <text x="300" y="200" font-size="17">Dalaran</text>
    <text x="300" y="290" font-size="13" fill="#a3a9ac">призыв Archimonde</text>
    <circle cx="810" cy="95" r="34" fill="#1b2c3a" stroke="#d7b779" stroke-width="3"/>
    <text x="810" y="101" font-size="15">5</text>
    <text x="810" y="45" font-size="17">Frozen Throne</text>
    <text x="810" y="153" font-size="13" fill="#a3a9ac">Arthas — Lich King</text>
  </g>
</svg>
