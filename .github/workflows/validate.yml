name: Validate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit and content tests
        run: npm test

      - name: Type check and build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # The Playwright web server rebuilds and serves the site under the /WOW base path.
      - name: End-to-end tests
        run: npm run test:e2e

      # Without this a pull request could add an invented quote and stay green until the weekly run.
      - name: Verify quotes changed by this pull request
        if: github.event_name == 'pull_request'
        run: |
          set -e
          changed=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" -- 'docs/research/evidence/*.json' | tr '\n' ' ')
          if [ -z "$changed" ]; then
            echo "The evidence ledger is unchanged."
            exit 0
          fi
          echo "Verifying: $changed"
          set +e
          node scripts/verify-evidence.mjs $changed
          status=$?
          if [ $status -eq 2 ]; then
            echo "::warning::Some sources could not be loaded; the quotes themselves are unchanged."
            exit 0
          fi
          exit $status

      - name: Upload Playwright results
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
